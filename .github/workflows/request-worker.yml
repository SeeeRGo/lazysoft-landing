name: Emergency manual MVP worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-request-worker
  cancel-in-progress: false

jobs:
  process:
    if: vars.REQUEST_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Process one request
        run: node automation/worker.mjs
        env:
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
          AUTOMATION_WORKER_SECRET: ${{ secrets.AUTOMATION_WORKER_SECRET }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
          ROUTERAI_MODEL: anthropic/claude-sonnet-5
          ROUTERAI_IMAGE_MODEL: black-forest-labs/flux.2-pro
          REQUEST_DEMO_BUCKET: ${{ vars.REQUEST_DEMO_BUCKET }}
          REQUEST_DEMO_ORIGIN: ${{ vars.REQUEST_DEMO_ORIGIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DEMO_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMO_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
